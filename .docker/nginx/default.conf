server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _; # Escucha en cualquier hostname
    root /var/www/html/public; # Raíz del sitio, apuntando a la carpeta public de Laravel
    index index.php index.html index.htm;

    # Deshabilitar el envío de la versión de Nginx en las cabeceras
    server_tokens off;

    # Logging
    access_log /dev/stdout; # Enviar logs a stdout para que Docker/Railway los capture
    error_log /dev/stderr error; # Enviar logs de error a stderr

    # Tamaño máximo del cuerpo de la solicitud (para subida de archivos)
    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesar archivos PHP con PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # PHP-FPM escucha en el puerto 9000 por defecto en la imagen php:fpm
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    # Bloquear el acceso a archivos sensibles
    location ~ /\.(?!well-known).* { # Bloquea archivos .htaccess, .git, etc.
        deny all;
    }
    location = /.env { # Bloquea específicamente el acceso a .env
        deny all;
    }
    location ~ /storage/logs/laravel.log { # Bloquea acceso directo al log principal
        deny all;
    }

    # Servir assets estáticos directamente con cabeceras de caché apropiadas
    location ~* \.(css|js|gif|ico|jpeg|jpg|png|svg|webp|woff|woff2|ttf|eot|otf)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }
}
